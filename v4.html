<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sticker Pack Picture Editor</title>
  <style>
    html,body{
      margin:0;
      padding:0;
      background:#333;
      width:100vw;
      min-height:100dvh;
      overscroll-behavior:none;
    }
    .canvas-container{
      position:fixed;
      inset:10px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* PDF wizard modal */
    .modalOverlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,0.6);
      display:flex; align-items:center; justify-content:center;
      z-index:9999;
    }
    .modalBox{
      width:min(520px, 92vw);
      background:#222;
      color:#fff;
      border-radius:12px;
      padding:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.45);
      font-family:sans-serif;
    }
    .modalBox h3{ margin:0 0 10px 0; font-size:16px; }
    .modalBox p{ margin:0 0 10px 0; font-size:12px; color:#ccc; line-height:1.4; }
    .modalBox input, .modalBox textarea, .modalBox select{
      width:100%;
      box-sizing:border-box;
      padding:10px;
      border-radius:8px;
      border:1px solid #444;
      background:#111;
      color:#fff;
      font-size:14px;
    }
    .modalBox textarea{ min-height:90px; resize:vertical; }
    .modalActions{
      display:flex;
      gap:8px;
      justify-content:flex-end;
      margin-top:12px;
    }
    .modalBtn{
      border:0;
      border-radius:8px;
      padding:10px 12px;
      background:#555;
      color:#fff;
      cursor:pointer;
      font-size:13px;
    }
    .modalBtn.primary{ background:#2e7dff; }
    .modalBtn:disabled{ opacity:0.5; cursor:not-allowed; }
  </style>
  <!-- jsPDF for zine PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="canvas-container">
  <canvas id="gameCanvas" width="681" height="840"></canvas>
</div>

<script>
  const DESIGN_WIDTH = 681,
        DESIGN_HEIGHT = 840,
        SIDEBAR_WIDTH = 249,
        MAIN_AREA_WIDTH = DESIGN_WIDTH - SIDEBAR_WIDTH;

  let currentScale = 1,
      lastTouchX = null,
      lastTouchY = null;

  const canvas = document.getElementById("gameCanvas"),
        ctx = canvas.getContext("2d");

  function drawRoundedRect(x,y,width,height,radiusTL,radiusTR,radiusBR,radiusBL){
    ctx.beginPath();
    ctx.moveTo(x+radiusTL,y);
    ctx.lineTo(x+width-radiusTR,y);
    ctx.quadraticCurveTo(x+width,y,x+width,y+radiusTR);
    ctx.lineTo(x+width,y+height-radiusBR);
    ctx.quadraticCurveTo(x+width,y+height,x+width-radiusBR,y+height);
    ctx.lineTo(x+radiusBL,y+height);
    ctx.quadraticCurveTo(x,y+height,x,y+height-radiusBL);
    ctx.lineTo(x,y+radiusTL);
    ctx.quadraticCurveTo(x,y,x+radiusTL,y);
    ctx.closePath();
    ctx.fill();
  }

  let backgroundX = 0,
      backgroundY = 0,
      toggleDragEnabled = false,
      toggleBorderOn = true,
      currentSwatchIndex = 0,
      selectedColor = "rgb(0,0,0)",
      circleInstances = [],
      dragging = false,
      draggedItem = null,
      offsetX = 0,
      offsetY = 0;

  const circleRadius = 50,
        smallCircleRadius = Math.floor(circleRadius / 3),
        initialSmallCirclePositions = [{x:458,y:350}],
        initialMediumCirclePositions = [{x:521,y:350}],
        initialCirclePositions = [{x:618,y:350}];

  /* ---- DRAW MODE (PAINT WITH SHAPES) ---- */
  let drawMode = false;
  let isDrawing = false;
  let drawLastX = 0;
  let drawLastY = 0;

  // Brush size tracks the last "selected" size (template size clicked or existing shape clicked)
  let currentBrushRadius = circleRadius;

  function pointInMainArea(x,y){
    return (x >= 0 && x <= MAIN_AREA_WIDTH && y >= 0 && y <= DESIGN_HEIGHT);
  }

  function addStampAt(x,y){
    const shp = getCurrentShape();
    const stamp = {
      shape: shp,
      color: selectedColor,
      pos: { x, y },
      radius: currentBrushRadius
    };
    circleInstances.push(stamp);
    return stamp;
  }

  function stampLine(x0,y0,x1,y1){
    const dx = x1 - x0;
    const dy = y1 - y0;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const step = Math.max(6, Math.floor(currentBrushRadius * 0.5));
    const steps = Math.max(1, Math.floor(dist / step));
    for(let i=1;i<=steps;i++){
      const t = i / steps;
      const x = x0 + dx * t;
      const y = y0 + dy * t;
      addStampAt(x,y);
    }
  }

  /* ---- UNDO HISTORY ---- */
  const MAX_HISTORY = 20;
  let historyStack = [];

  function saveState(){
    const circlesCopy = circleInstances.map(o => ({
      shape: o.shape,
      color: o.color,
      pos: { x: o.pos.x, y: o.pos.y },
      radius: o.radius
    }));
    const zinePagesCopy = zinePages.map(p => ({
      dataUrl: p.dataUrl,
      img: p.img
    }));
    historyStack.push({
      backgroundX,
      backgroundY,
      toggleDragEnabled,
      toggleBorderOn,
      currentSwatchIndex,
      selectedColor,
      circleInstances: circlesCopy,
      currentPatternFunction,
      checkerboardImg,
      zinePages: zinePagesCopy,
      zineTitle,
      selectedZineIndex,
      currentShapeIdx,
      currentPatternIndex,
      patternScrollY,
      zinePreviewIndex,
      drawMode,
      currentBrushRadius
    });
    if(historyStack.length > MAX_HISTORY){
      historyStack.shift();
    }
  }

  function undoLastAction(){
    if(historyStack.length === 0) return;
    const state = historyStack.pop();
    backgroundX = state.backgroundX;
    backgroundY = state.backgroundY;
    toggleDragEnabled = state.toggleDragEnabled;
    toggleBorderOn = state.toggleBorderOn;
    currentSwatchIndex = state.currentSwatchIndex;
    selectedColor = state.selectedColor;
    circleInstances = state.circleInstances.map(o => ({
      shape: o.shape,
      color: o.color,
      pos: { x: o.pos.x, y: o.pos.y },
      radius: o.radius
    }));
    currentPatternFunction = state.currentPatternFunction;
    checkerboardImg = state.checkerboardImg;
    zinePages = state.zinePages.map(p => ({
      dataUrl: p.dataUrl,
      img: p.img
    }));
    zineTitle = state.zineTitle;
    selectedZineIndex = state.selectedZineIndex;
    currentShapeIdx = state.currentShapeIdx;
    toggleDragButton.label = toggleDragEnabled ? "BG Move On" : "BG Move Off";
    currentPatternIndex = (typeof state.currentPatternIndex === "number")
      ? state.currentPatternIndex
      : patternFunctions.indexOf(currentPatternFunction);
    patternScrollY = (typeof state.patternScrollY === "number") ? state.patternScrollY : 0;

    zinePreviewIndex = (typeof state.zinePreviewIndex === "number") ? state.zinePreviewIndex : -1;
    if(zinePreviewIndex >= 0 && zinePreviewIndex < zinePages.length){
      setZinePreview(zinePreviewIndex);
    }else{
      setZinePreview(-1);
    }

    drawMode = !!state.drawMode;
    currentBrushRadius = (typeof state.currentBrushRadius === "number") ? state.currentBrushRadius : circleRadius;

    clampPatternScroll();
  }

  /* ---- COLOUR SWATCHES ---- */
  const colorSwatches = [
          [200,0,0],[255,80,80],[139,0,0],[255,128,0],
          [255,165,0],[255,200,120],[255,215,0],[255,240,120],
          [240,200,0],[0,128,0],[60,179,113],[170,230,170],
          [0,0,180],[65,105,225],[140,180,255],[128,0,128],
          [153,50,204],[200,160,240],[0,0,0],[64,64,64],
          [128,128,128],[160,160,160],[192,192,192],[255,255,255]
        ],
        swatchWidth = 40,
        swatchHeight = 40;

  const swatchPositions = [];
  const rows = 6, cols = 4;

  // Shifted left a bit so zine panel can sit to the right
  for(let i=0;i<colorSwatches.length;i++){
    let row = Math.floor(i / cols),
        col = i % cols,
        x = DESIGN_WIDTH - 240 + col * (swatchWidth + 1),
        y = 40 + row * (swatchHeight + 1);
    swatchPositions.push({x,y});
  }

  /* ---- ZINE PANEL CONSTANTS (no scrolling, max 4 pages) ---- */
  const ZINE_MAX_PAGES = 4;
  const ZINE_PANEL_WIDTH = 55;
  const ZINE_PANEL_Y = 40;
  const ZINE_PANEL_HEIGHT = rows * (swatchHeight + 1);  // same vertical span as swatches
  const ZINE_PANEL_X = DESIGN_WIDTH - ZINE_PANEL_WIDTH - 5;
  const ZINE_THUMB_W = 45;
  const ZINE_THUMB_H = 45;
  const ZINE_THUMB_MARGIN = 5;
  const ZINE_BUTTON_HEIGHT = 18;

  let zinePages = [];        // [{dataUrl,img}]
  let selectedZineIndex = -1;
  let zineTitle = "";

  /* ---- ZINE PREVIEW + PREVIEW LOCK ---- */
  let zinePreviewIndex = -1;
  let zinePreviewImg = null;

  function setZinePreview(idx){
    if(idx >= 0 && idx < zinePages.length){
      zinePreviewIndex = idx;
      zinePreviewImg = zinePages[idx].img;
      if(zinePreviewImg && !zinePreviewImg.complete){
        zinePreviewImg.onload = () => { /* draw loop picks it up */ };
      }
    }else{
      zinePreviewIndex = -1;
      zinePreviewImg = null;
    }
  }

  const zineAddButton = {
    x: ZINE_PANEL_X + 5,
    y: ZINE_PANEL_Y + 4,
    w: ZINE_PANEL_WIDTH - 10,
    h: ZINE_BUTTON_HEIGHT,
    label: "Add"
  };
  const zinePdfButton = {
    x: ZINE_PANEL_X + 5,
    y: ZINE_PANEL_Y + 4 + ZINE_BUTTON_HEIGHT + 3,
    w: ZINE_PANEL_WIDTH - 10,
    h: ZINE_BUTTON_HEIGHT,
    label: "PDF"
  };

  function drawZinePanel(){
    ctx.save();
    ctx.fillStyle = "rgb(40,40,40)";
    drawRoundedRect(ZINE_PANEL_X,ZINE_PANEL_Y,ZINE_PANEL_WIDTH,ZINE_PANEL_HEIGHT,6,6,6,6);

    // Add button
    ctx.fillStyle = "rgb(90,90,90)";
    drawRoundedRect(zineAddButton.x,zineAddButton.y,zineAddButton.w,zineAddButton.h,4,4,4,4);
    ctx.fillStyle = "white";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(zineAddButton.label,
                 zineAddButton.x + zineAddButton.w/2,
                 zineAddButton.y + zineAddButton.h/2);

    // PDF button
    ctx.fillStyle = "rgb(90,90,90)";
    drawRoundedRect(zinePdfButton.x,zinePdfButton.y,zinePdfButton.w,zinePdfButton.h,4,4,4,4);
    ctx.fillStyle = "white";
    ctx.font = "9px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(zinePdfButton.label,
                 zinePdfButton.x + zinePdfButton.w/2,
                 zinePdfButton.y + zinePdfButton.h/2);

    // page count
    ctx.fillStyle = "rgb(200,200,200)";
    ctx.font = "8px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const countY = ZINE_PANEL_Y + 4 + (ZINE_BUTTON_HEIGHT + 3) * 2 + 1;
    ctx.fillText(`${zinePages.length}/${ZINE_MAX_PAGES}`,
                 ZINE_PANEL_X + ZINE_PANEL_WIDTH/2,
                 countY);

    // thumbnails (max 4, no scroll)
    const thumbsTop = countY + 10;
    for(let i=0;i<zinePages.length && i<ZINE_MAX_PAGES;i++){
      const thumbX = ZINE_PANEL_X + 5;
      const thumbY = thumbsTop + i * (ZINE_THUMB_H + ZINE_THUMB_MARGIN);

      ctx.fillStyle = "rgb(25,25,25)";
      ctx.fillRect(thumbX,thumbY,ZINE_THUMB_W,ZINE_THUMB_H);
      ctx.strokeStyle = "rgb(70,70,70)";
      ctx.strokeRect(thumbX,thumbY,ZINE_THUMB_W,ZINE_THUMB_H);

      const page = zinePages[i];
      const img = page.img;
      if (img && img.complete){
        const ratio = img.width / img.height;
        let w,h;
        if (ratio > 1){
          w = ZINE_THUMB_W - 4;
          h = w / ratio;
        } else {
          h = ZINE_THUMB_H - 4;
          w = h * ratio;
        }
        const ix = thumbX + (ZINE_THUMB_W - w)/2;
        const iy = thumbY + (ZINE_THUMB_H - h)/2;
        ctx.drawImage(img,ix,iy,w,h);
      } else {
        ctx.strokeStyle = "rgb(120,120,120)";
        ctx.beginPath();
        ctx.moveTo(thumbX+3,thumbY+3);
        ctx.lineTo(thumbX+ZINE_THUMB_W-3,thumbY+ZINE_THUMB_H-3);
        ctx.moveTo(thumbX+ZINE_THUMB_W-3,thumbY+3);
        ctx.lineTo(thumbX+3,thumbY+ZINE_THUMB_H-3);
        ctx.stroke();
      }

      // index tag
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(thumbX,thumbY,12,10);
      ctx.fillStyle = "white";
      ctx.font = "8px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(i+1), thumbX+6, thumbY+5);

      // Selected highlight
      if (i === selectedZineIndex){
        ctx.strokeStyle = "rgb(255,255,0)";
        ctx.lineWidth = 2;
        ctx.strokeRect(thumbX-1,thumbY-1,ZINE_THUMB_W+2,ZINE_THUMB_H+2);
        ctx.lineWidth = 1;
      }

      // Preview highlight (cyan)
      if (i === zinePreviewIndex){
        ctx.strokeStyle = "rgb(0,255,255)";
        ctx.lineWidth = 2;
        ctx.strokeRect(thumbX+1,thumbY+1,ZINE_THUMB_W-2,ZINE_THUMB_H-2);
        ctx.lineWidth = 1;
      }
    }

    ctx.restore();
  }

  /* SHAPES */
  const shapeTypes = ["circle","plus","halfUp","halfDown","halfLeft","halfRight","square"];
  let currentShapeIdx = 0;
  function getCurrentShape(){ return shapeTypes[currentShapeIdx]; }

  const shapeButton = {
    x: DESIGN_WIDTH-230,
    y: DESIGN_HEIGHT-260,
    w: 100,
    h: 50,
    colour:"rgb(100,100,100)",
    label:"Shape"
  };

  function drawShape(shape,x,y,r,colour){
    ctx.save();
    ctx.fillStyle = colour;
    switch(shape){
      case "circle":
        ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();break;
      case "square":
        ctx.fillRect(Math.floor(x-r),Math.floor(y-r),Math.floor(2*r),Math.floor(2*r));break;
      case "plus":
        const t = Math.max(2,Math.floor(r*0.6));
        ctx.beginPath();
        ctx.moveTo(x-t/2,y-r);
        ctx.lineTo(x+t/2,y-r);
        ctx.lineTo(x+t/2,y-t/2);
        ctx.lineTo(x+r,y-t/2);
        ctx.lineTo(x+r,y+t/2);
        ctx.lineTo(x+t/2,y+t/2);
        ctx.lineTo(x+t/2,y+r);
        ctx.lineTo(x-t/2,y+r);
        ctx.lineTo(x-t/2,y+t/2);
        ctx.lineTo(x-r,y+t/2);
        ctx.lineTo(x-r,y-t/2);
        ctx.lineTo(x-t/2,y-t/2);
        ctx.closePath();
        ctx.fill();
        break;
      case "halfUp":
        ctx.beginPath();
        ctx.moveTo(x-r,y);
        ctx.arc(x,y,r,Math.PI,0,false);
        ctx.lineTo(x+r,y);
        ctx.closePath();
        ctx.fill();
        break;
      case "halfDown":
        ctx.beginPath();
        ctx.moveTo(x-r,y);
        ctx.arc(x,y,r,0,Math.PI,false);
        ctx.lineTo(x-r,y);
        ctx.closePath();
        ctx.fill();
        break;
      case "halfLeft":
        ctx.beginPath();
        ctx.moveTo(x,y-r);
        ctx.lineTo(x,y+r);
        ctx.arc(x,y,r,Math.PI/2,-Math.PI/2,false);
        ctx.closePath();
        ctx.fill();
        break;
      case "halfRight":
        ctx.beginPath();
        ctx.moveTo(x,y-r);
        ctx.arc(x,y,r,-Math.PI/2,Math.PI/2,false);
        ctx.lineTo(x,y-r);
        ctx.closePath();
        ctx.fill();
        break;
    }
    ctx.restore();
  }

  function drawShapeOutline(shape,x,y,r){
    ctx.beginPath();
    switch(shape){
      case "circle":
        ctx.arc(x,y,r,0,Math.PI*2);break;
      case "square":
        ctx.rect(Math.floor(x-r),Math.floor(y-r),Math.floor(2*r),Math.floor(2*r));break;
      case "plus":
        const t = Math.max(2,Math.floor(r*0.6));
        ctx.moveTo(x-t/2,y-r);
        ctx.lineTo(x+t/2,y-r);
        ctx.lineTo(x+t/2,y-t/2);
        ctx.lineTo(x+r,y-t/2);
        ctx.lineTo(x+r,y+t/2);
        ctx.lineTo(x+t/2,y+t/2);
        ctx.lineTo(x+t/2,y+r);
        ctx.lineTo(x-t/2,y+r);
        ctx.lineTo(x-t/2,y+t/2);
        ctx.lineTo(x-r,y+t/2);
        ctx.lineTo(x-r,y-t/2);
        ctx.lineTo(x-t/2,y-t/2);
        ctx.closePath();
        break;
      case "halfUp":
        ctx.moveTo(x-r,y);
        ctx.arc(x,y,r,Math.PI,0,false);
        ctx.lineTo(x+r,y);
        ctx.closePath();
        break;
      case "halfDown":
        ctx.moveTo(x-r,y);
        ctx.arc(x,y,r,0,Math.PI,false);
        ctx.lineTo(x-r,y);
        ctx.closePath();
        break;
      case "halfLeft":
        ctx.moveTo(x,y-r);
        ctx.lineTo(x,y+r);
        ctx.arc(x,y,r,Math.PI/2,-Math.PI/2,false);
        ctx.closePath();
        break;
      case "halfRight":
        ctx.moveTo(x,y-r);
        ctx.arc(x,y,r,-Math.PI/2,Math.PI/2,false);
        ctx.lineTo(x,y-r);
        ctx.closePath();
        break;
    }
    ctx.stroke();
  }

  function isPointInShape(shape,cx,cy,r,px,py){
    ctx.save();
    ctx.beginPath();
    switch(shape){
      case "circle":
        ctx.arc(cx,cy,r,0,Math.PI*2);break;
      case "square":
        ctx.rect(Math.floor(cx-r),Math.floor(cy-r),Math.floor(2*r),Math.floor(2*r));break;
      case "plus":
        const t = Math.max(2,Math.floor(r*0.6));
        ctx.moveTo(cx-t/2,cy-r);
        ctx.lineTo(cx+t/2,cy-r);
        ctx.lineTo(cx+t/2,cy-t/2);
        ctx.lineTo(cx+r,cy-t/2);
        ctx.lineTo(cx+r,cy+t/2);
        ctx.lineTo(cx+t/2,cy+t/2);
        ctx.lineTo(cx+t/2,cy+r);
        ctx.lineTo(cx-t/2,cy+r);
        ctx.lineTo(cx-t/2,cy+t/2);
        ctx.lineTo(cx-r,cy+t/2);
        ctx.lineTo(cx-r,cy-t/2);
        ctx.lineTo(cx-t/2,cy-t/2);
        ctx.closePath();
        break;
      case "halfUp":
        ctx.moveTo(cx-r,cy);
        ctx.arc(cx,cy,r,Math.PI,0,false);
        ctx.lineTo(cx+r,cy);
        ctx.closePath();
        break;
      case "halfDown":
        ctx.moveTo(cx-r,cy);
        ctx.arc(cx,cy,r,0,Math.PI,false);
        ctx.lineTo(cx-r,cy);
        ctx.closePath();
        break;
      case "halfLeft":
        ctx.moveTo(cx,cy-r);
        ctx.lineTo(cx,cy+r);
        ctx.arc(cx,cy,r,Math.PI/2,-Math.PI/2,false);
        ctx.closePath();
        break;
      case "halfRight":
        ctx.moveTo(cx,cy-r);
        ctx.arc(cx,cy,r,-Math.PI/2,Math.PI/2,false);
        ctx.lineTo(cx,cy-r);
        ctx.closePath();
        break;
    }
    const inside = ctx.isPointInPath(px,py);
    ctx.restore();
    return inside;
  }

  /* ---- PATTERNS ---- */
  function Pattern1(low_width,low_height){
    let offCanvas = document.createElement("canvas");
    offCanvas.width = low_width;
    offCanvas.height = low_height;
    let offCtx = offCanvas.getContext("2d"),
        imageData = offCtx.createImageData(low_width,low_height),
        phase1 = Math.random()*5*Math.PI,
        phase2 = Math.random()*5*Math.PI,
        freq1 = Math.random()*7+1,
        freq2 = Math.random()*7+1,
        amp1 = Math.random()*0.49+0.01,
        amp2 = Math.random()*0.49+0.01,
        colour1 = [Math.floor(Math.random()*256),Math.floor(Math.random()*256),Math.floor(Math.random()*256)],
        colour2 = [Math.floor(Math.random()*256),Math.floor(Math.random()*256),Math.floor(Math.random()*256)],
        rArray = new Float32Array(low_width*low_height);
    let index=0,max_r=0;
    for(let i=0;i<low_height;i++){
      let y=-1+2*i/(low_height-1);
      for(let j=0;j<low_width;j++){
        let x=-1+2*j/(low_width-1),
            r=Math.sqrt(x*x+y*y),
            theta=Math.atan2(y,x);
        r+=amp1*Math.sin(freq1*theta+phase1);
        r+=amp2*Math.sin(freq2*theta+phase2);
        rArray[index]=r;
        if(r>max_r)max_r=r;
        index++;
      }
    }
    index=0;
    for(let i=0;i<low_height;i++){
      for(let j=0;j<low_width;j++){
        let t=Math.min(Math.max(rArray[index]/max_r,0),1),
            colour=t<0.5?colour1:colour2,
            pixelIndex=index*4;
        imageData.data[pixelIndex]=colour[0];
        imageData.data[pixelIndex+1]=colour[1];
        imageData.data[pixelIndex+2]=colour[2];
        imageData.data[pixelIndex+3]=255;
        index++;
      }
    }
    offCtx.putImageData(imageData,0,0);
    return offCanvas;
  }
  function Pattern2(low_width,low_height){
    let c=document.createElement("canvas");
    c.width=low_width;c.height=low_height;
    let cx=c.getContext("2d"),
        numLayers=4,colours=[];
    for(let i=0;i<numLayers;i++){
      colours.push([Math.floor(Math.random()*256),Math.floor(Math.random()*256),Math.floor(Math.random()*256)]);
    }
    const rArr=new Float32Array(low_width*low_height),

        return [[petal_color,background,petal_color],[background,petal_color,background],[petal_color,background,petal_color]];
      }
    }
    function get_4x4_pattern(){
      let color=Math.random()<0.5?mustard:(Math.random()<0.5?coral:ultramarine),
          pattern_4x4=[[0,color,color,0],[color,0,0,color],[color,0,0,color],[0,color,color,0]];
      return pattern_4x4.map(row=>row.map(cell=>cell===color?color:background));
    }
    function draw_pattern(x,y,block_size,pattern){
      for(let i=0;i<pattern.length;i++){
        for(let j=0;j<pattern[i].length;j++){
          let col=pattern[i][j];
          cx.fillStyle="rgb("+col.join(",")+")";
          cx.fillRect(x+j*block_size,y+i*block_size,block_size,block_size);
        }
      }
    }
    const base_grid_spacing=Math.floor(Math.random()*(250-160))+160;
    for(let y=0;y<low_height;y+=base_grid_spacing){
      for(let x=0;x<low_width;x+=base_grid_spacing){
        if(Math.random()*10>1){
          let pattern_choice=Math.random()<0.5?"3x3":"4x4",
              pattern,flower_size;
          if(pattern_choice==="3x3"){
            const sizes=[Math.floor(base_grid_spacing/3),Math.floor(base_grid_spacing/4),Math.floor(base_grid_spacing/6)];
            flower_size=sizes[Math.floor(Math.random()*sizes.length)];
            pattern=get_flower_pattern();
          }else{
            flower_size=Math.floor(base_grid_spacing/4);
            pattern=get_4x4_pattern();
          }
          const offsetX=x+base_grid_spacing/2-(pattern[0].length*flower_size)/2,
                offsetY=y+base_grid_spacing/2-(pattern.length*flower_size)/2;
          draw_pattern(offsetX,offsetY,flower_size,pattern);
        }
      }
    }
    return c;
  }
  function Pattern13(surface_width,surface_height){
    let c=document.createElement("canvas");
    c.width=surface_width;c.height=surface_height;
    let cx=c.getContext("2d");
    const BG=[220,220,220],
          rect_colors=[[255,105,180],[255,165,0],[255,0,0],[0,145,0],[173,216,230]],
          retro_shapes=[[255,29,48],[0,205,0],[173,216,230],[255,165,0]];
    cx.fillStyle=`rgb(${BG.join(",")})`;
    cx.fillRect(0,0,surface_width,surface_height);
    const cxmid=Math.floor(surface_width/2),h=surface_height;
    let minW=30+Math.floor(Math.random()*20),
        maxW=minW+40+Math.floor(Math.random()*70),
        progress=Math.random();
    let count=Math.ceil(cxmid/minW)+2,
        current_colors=Array.from({length:count},()=>rect_colors[Math.floor(Math.random()*rect_colors.length)]),
        next_colors=Array.from({length:count},()=>rect_colors[Math.floor(Math.random()*rect_colors.length)]);
    function lerp(a,b,t){return Math.floor(a+(b-a)*t);}
    let i=0;
    for(let x=0;x<=cxmid;x+=minW){
      let dist=Math.abs(cxmid-x),
          norm=Math.pow(dist/cxmid,0.5);
      let baseW=minW+Math.floor((maxW-minW)*norm),
          jitter=0.75+Math.random()*0.7;
      let w=Math.max(minW,Math.floor(baseW*jitter));
      let ccol=current_colors[i%count],
          ncol=next_colors[i%count],
          col=[lerp(ccol[0],ncol[0],progress),lerp(ccol[1],ncol[1],progress),lerp(ccol[2],ncol[2],progress)];
      cx.fillStyle=`rgb(${col.join(",")})`;
      cx.fillRect(cxmid-x-w,0,w,h);
      cx.fillRect(cxmid+x,0,w,h);
      i++;
    }
    function drawPlus(x,y,s,clr){
      let bw=Math.floor(s/3);
      cx.fillStyle=clr;
      cx.fillRect(Math.floor(x-bw/2),Math.floor(y-s/2),bw,s);
      cx.fillRect(Math.floor(x-s/2),Math.floor(y-bw/2),s,bw);
    }
    function drawDiamond(x,y,s,clr){
      cx.fillStyle=clr;
      cx.beginPath();
      cx.moveTo(Math.floor(x),Math.floor(y-s/2));
      cx.lineTo(Math.floor(x-s/2),Math.floor(y));
      cx.lineTo(Math.floor(x),Math.floor(y+s/2));
      cx.lineTo(Math.floor(x+s/2),Math.floor(y));
      cx.closePath();
      cx.fill();
    }
    function drawX(x,y,s,clr){
      let w=Math.max(2,Math.floor(s/6)),m=s;
      cx.save();
      cx.beginPath();
      cx.rect(Math.floor(x-s/2),Math.floor(y-s/2),Math.floor(s),Math.floor(s));
      cx.clip();
      cx.strokeStyle=clr;
      cx.lineWidth=w;
      cx.lineCap="butt";
      cx.beginPath();
      cx.moveTo(x-s/2-m,y-s/2-m);
      cx.lineTo(x+s/2+m,y+s/2+m);
      cx.moveTo(x+s/2+m,y-s/2-m);
      cx.lineTo(x-s/2-m,y+s/2+m);
      cx.stroke();
      cx.restore();
    }
    (function placeShape(){
      if(Math.random()<0.7){
        let size=60+Math.floor(Math.random()*100),
            half=Math.floor(size/2),
            pad=Math.max(6,Math.floor(size*0.12));
        let px=half+pad+Math.floor(Math.random()*(surface_width-2*(half+pad))),
            py=half+pad+Math.floor(Math.random()*(h-2*(half+pad)));
        let col=retro_shapes[Math.floor(Math.random()*retro_shapes.length)],
            clr=`rgb(${col.join(",")})`,
            pick=Math.random();
        if(pick<0.4)drawPlus(px,py,size,clr);
        else if(pick<0.7)drawDiamond(px,py,size,clr);
        else drawX(px,py,size,clr);
      }
    })();
    cx.globalAlpha=0.06+Math.random()*0.06;
    let spacing=3+Math.floor(Math.random()*3);
    cx.fillStyle="rgb(0,0,0)";
    for(let y=0;y<h;y+=spacing)cx.fillRect(0,y,surface_width,1);
    cx.globalAlpha=1;
    return c;
  }

  /* ---- PATTERN THUMB STRIP (AUTO-FIT + 2 COLS) ---- */
  let PAT_PANEL = {
    x: DESIGN_WIDTH - 230,
    y: 300,
    w: 210,
    h: 200
  };

  const PAT_COLS = 2;
  const PAT_THUMB_PAD = 10;
  const PAT_INNER_PAD = 10;
  const PAT_HEADER_H = 18;

  const PAT_THUMB_SRC = 96;  // generate thumbs at this size once
  let patThumbDraw = 80;     // actual drawn size (auto-fit)
  let patternThumbs = [];

  let currentPatternIndex = patternFunctions.indexOf(currentPatternFunction);
  let patternScrollY = 0;

  let patTracking = false;
  let patStartY = 0;
  let patStartScrollY = 0;
  let patMoved = false;
  let patStartX = 0;

  function autoLayoutPatternPanel(){
    // Top: just below swatches (and zine panel area)
    const swatchesBottom = 40 + rows * (swatchHeight + 20);
    const top = swatchesBottom + 10;

    // Bottom: keep clear of the first button that lives in this lower area
    const bottomLimit = Math.min(
      toggleDragButton.y,
      shapeButton.y,
      deleteButton.y,
      backgroundButton.y,
      randomButton.y,
      undoButton.y,
      resetButton.y,
      resetBgButton.y,
      saveButton.y
    ) - 10;

    PAT_PANEL.y = top;

    // If something unexpected happens, keep a minimum height
    PAT_PANEL.h = Math.max(120, bottomLimit - top);

    // Compute draw-size so 2 columns fit nicely
    const innerW = PAT_PANEL.w - PAT_INNER_PAD*2;
    const maxSizeThatFits = Math.floor((innerW - (PAT_COLS - 1) * PAT_THUMB_PAD) / PAT_COLS);
    patThumbDraw = Math.max(56, Math.min(PAT_THUMB_SRC, maxSizeThatFits));

    clampPatternScroll();
  }

  function buildPatternThumbs(){
    // One-time previews (each pattern is random; these are just visual cues)
    patternThumbs = patternFunctions.map(fn => fn(PAT_THUMB_SRC, PAT_THUMB_SRC));
  }

  function getPatListHeight(){
    const rowsCount = Math.ceil(patternFunctions.length / PAT_COLS);
    if(rowsCount <= 0) return 0;
    return rowsCount * patThumbDraw + (rowsCount - 1) * PAT_THUMB_PAD;
  }

  function clampPatternScroll(){
    const innerH = PAT_PANEL.h - PAT_HEADER_H - PAT_INNER_PAD*2;
    const contentH = getPatListHeight();
    const minScroll = Math.min(0, innerH - contentH);
    const maxScroll = 0;
    if(patternScrollY < minScroll) patternScrollY = minScroll;
    if(patternScrollY > maxScroll) patternScrollY = maxScroll;
  }

  function drawPatternPicker(){
    ctx.save();
    ctx.fillStyle = "rgb(40,40,40)";
    drawRoundedRect(PAT_PANEL.x, PAT_PANEL.y, PAT_PANEL.w, PAT_PANEL.h, 10,10,10,10);

    // Header
    ctx.fillStyle = "rgb(210,210,210)";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("Patterns", PAT_PANEL.x + PAT_INNER_PAD, PAT_PANEL.y + 4);

    const innerX = PAT_PANEL.x + PAT_INNER_PAD;
    const innerY = PAT_PANEL.y + PAT_HEADER_H + PAT_INNER_PAD;
    const innerW = PAT_PANEL.w - PAT_INNER_PAD*2;
    const innerH = PAT_PANEL.h - PAT_HEADER_H - PAT_INNER_PAD*2;

    // Clip scrolling area
    ctx.beginPath();
    ctx.rect(innerX, innerY, innerW, innerH);
    ctx.clip();

    // Center a 2-col grid inside innerW
    const gridW = PAT_COLS * patThumbDraw + (PAT_COLS - 1) * PAT_THUMB_PAD;
    const startX = innerX + Math.floor((innerW - gridW) / 2);

    for(let i=0;i<patternThumbs.length;i++){
      const col = i % PAT_COLS;
      const row = Math.floor(i / PAT_COLS);

      const tx = startX + col * (patThumbDraw + PAT_THUMB_PAD);
      const ty = innerY + patternScrollY + row * (patThumbDraw + PAT_THUMB_PAD);

      if(ty + patThumbDraw < innerY - 5) continue;
      if(ty > innerY + innerH + 5) continue;

      // Frame
      ctx.fillStyle = "rgb(25,25,25)";
      ctx.fillRect(tx-2, ty-2, patThumbDraw+4, patThumbDraw+4);

      // Preview (scaled)
      const thumb = patternThumbs[i];
      if(thumb){
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(thumb, tx, ty, patThumbDraw, patThumbDraw);
      }

      // Index tag
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(tx, ty, 18, 14);
      ctx.fillStyle = "white";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(i+1), tx+9, ty+7);

      // Highlight selected
      if(i === currentPatternIndex){
        ctx.strokeStyle = "rgb(255,255,0)";
        ctx.lineWidth = 3;
        ctx.strokeRect(tx-2, ty-2, patThumbDraw+4, patThumbDraw+4);
        ctx.lineWidth = 1;
      }else{
        ctx.strokeStyle = "rgb(80,80,80)";
        ctx.lineWidth = 1;
        ctx.strokeRect(tx-2, ty-2, patThumbDraw+4, patThumbDraw+4);
      }
    }

    ctx.restore();

    // Scrollbar hint
    const contentH = getPatListHeight();
    if(contentH > innerH){
      const innerX2 = PAT_PANEL.x + PAT_INNER_PAD;
      const innerY2 = PAT_PANEL.y + PAT_HEADER_H + PAT_INNER_PAD;
      const innerH2 = PAT_PANEL.h - PAT_HEADER_H - PAT_INNER_PAD*2;

      const trackX = PAT_PANEL.x + PAT_PANEL.w - 8;
      const trackY = innerY2;
      const trackH = innerH2;

      const maxScroll = 0;
      const minScroll = innerH2 - contentH;

      const t = (patternScrollY - maxScroll) / (minScroll - maxScroll); // 0..1
      const handleH = Math.max(22, Math.floor(trackH * (innerH2 / contentH)));
      const handleY = trackY + Math.floor((trackH - handleH) * t);

      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fillRect(trackX, trackY, 4, trackH);
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.fillRect(trackX, handleY, 4, handleH);
      ctx.restore();
    }
  }

  function pointInPatPanel(x,y){
    return (x>=PAT_PANEL.x && x<=PAT_PANEL.x+PAT_PANEL.w &&
            y>=PAT_PANEL.y && y<=PAT_PANEL.y+PAT_PANEL.h);
  }

  function patIndexFromPoint(x,y){
    const innerX = PAT_PANEL.x + PAT_INNER_PAD;
    const innerY = PAT_PANEL.y + PAT_HEADER_H + PAT_INNER_PAD;
    const innerW = PAT_PANEL.w - PAT_INNER_PAD*2;
    const innerH = PAT_PANEL.h - PAT_HEADER_H - PAT_INNER_PAD*2;

    if(!(x>=innerX && x<=innerX+innerW && y>=innerY && y<=innerY+innerH)) return -1;

    const gridW = PAT_COLS * patThumbDraw + (PAT_COLS - 1) * PAT_THUMB_PAD;
    const startX = innerX + Math.floor((innerW - gridW) / 2);

    const localX = x - startX;
    const localY = (y - innerY) - patternScrollY;

    if(localX < 0 || localX > gridW) return -1;
    if(localY < 0) return -1;

    const stepX = patThumbDraw + PAT_THUMB_PAD;
    const stepY = patThumbDraw + PAT_THUMB_PAD;

    const col = Math.floor(localX / stepX);
    const row = Math.floor(localY / stepY);

    if(col < 0 || col >= PAT_COLS) return -1;

    const inThumbX = (localX % stepX) <= patThumbDraw;
    const inThumbY = (localY % stepY) <= patThumbDraw;
    if(!inThumbX || !inThumbY) return -1;

    const idx = row * PAT_COLS + col;
    if(idx < 0 || idx >= patternFunctions.length) return -1;

    return idx;
  }

  /* RENDER MAIN AREA FOR SAVE/PRINT/ZINE */
  function renderMainAreaToCanvas(scaleFactor){
    const offCanvas=document.createElement("canvas");
    offCanvas.width=MAIN_AREA_WIDTH*scaleFactor;
    offCanvas.height=DESIGN_HEIGHT*scaleFactor;
    const offCtx=offCanvas.getContext("2d");
    offCtx.imageSmoothingEnabled=false;
    offCtx.drawImage(canvas,0,0,MAIN_AREA_WIDTH,DESIGN_HEIGHT,0,0,offCanvas.width,offCanvas.height);
    return offCanvas;
  }

  function saveMainImage(){
    const offCanvas=renderMainAreaToCanvas(2);
    const link=document.createElement("a");
    const d=new Date(),p=n=>String(n).padStart(2,"0"),
          fname=`${String(d.getFullYear()).slice(-2)}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}_SPPE.png`;
    link.download=fname;
    link.href=offCanvas.toDataURL();
    link.click();
  }

  function printMainImage(){
    const offCanvas=renderMainAreaToCanvas(2);
    const dataUrl=offCanvas.toDataURL("image/png");
    const w=window.open("","_blank");
    if(!w){
      alert("Pop-up blocked. Please allow pop-ups to print.");
      return;
    }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Print Sticker</title><style>@page{margin:0}html,body{margin:0;height:100%;background:#fff}body{display:flex;align-items:center;justify-content:center}img{max-width:100vw;max-height:100vh;display:block}</style></head><body><img src="${dataUrl}" alt="SPPE Print"><script>window.onload=()=>{setTimeout(()=>{window.print();window.onafterprint=()=>window.close()},100)}<\/script></body></html>`);
    w.document.close();
  }

  function addPageToZine(){
    saveState();
    const dataUrl=captureMainImageForZine();

    img.src=dataUrl;

    if(selectedZineIndex>=0 && selectedZineIndex<zinePages.length){
      zinePages[selectedZineIndex]={dataUrl,img};
      if(zinePreviewIndex === selectedZineIndex){
        setZinePreview(selectedZineIndex);

    }else{
      if(zinePages.length>=ZINE_MAX_PAGES){

      zinePages.push({dataUrl,img});

  function addOverlayText(pdf,text,xImg,yImg,wImg,hImg,textColor){
    if(!text) return;
    const words=text.trim().split(/\s+/).slice(0,5);
    if(words.length===0) return;

    pdf.setFontSize(45);
    pdf.setTextColor(textColor[0],textColor[1],textColor[2]);

    const startX = xImg + 20;
    let startY = yImg + 60;
    const lineStep = 50;
    words.forEach((word,idx)=>{
      pdf.text(word,startX,startY+idx*lineStep,{align:"left"});
    });
  }

  function openPdfWizard(initialTitle){
    return new Promise((resolve)=>{
      const state = {
        step: 0,
        title: initialTitle || "",
        backText: "",
        titleColour: "black",
        backColour: "black"
      };

      const overlay = document.createElement("div");
      overlay.className = "modalOverlay";

      const box = document.createElement("div");
      box.className = "modalBox";

      const titleEl = document.createElement("h3");
      const helpEl = document.createElement("p");

      const fieldWrap = document.createElement("div");

      const actions = document.createElement("div");
      actions.className = "modalActions";

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "modalBtn";
      cancelBtn.textContent = "Cancel";

      const backBtn = document.createElement("button");
      backBtn.className = "modalBtn";
      backBtn.textContent = "Back";

      const nextBtn = document.createElement("button");
      nextBtn.className = "modalBtn primary";
      nextBtn.textContent = "Next";

      actions.appendChild(cancelBtn);
      actions.appendChild(backBtn);
      actions.appendChild(nextBtn);

      box.appendChild(titleEl);
      box.appendChild(helpEl);
      box.appendChild(fieldWrap);
      box.appendChild(actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);

      function cleanup(result){
        document.removeEventListener("keydown", onKey);
        overlay.remove();
        resolve(result);
      }

      function onKey(e){
        if(e.key === "Escape") cleanup(null);
      }
      document.addEventListener("keydown", onKey);

      function renderStep(){
        fieldWrap.innerHTML = "";
        backBtn.disabled = (state.step === 0);

        if(state.step === 0){
          titleEl.textContent = "PDF Step 1/4 — Zine title";
          helpEl.textContent = "Up to 5 words. Each word becomes a line on the front page + used for filename.";
          const inp = document.createElement("input");
          inp.value = state.title;
          inp.placeholder = "e.g. Wavy Patterns";
          inp.oninput = () => state.title = inp.value;
          fieldWrap.appendChild(inp);
          nextBtn.textContent = "Next";
          setTimeout(()=>inp.focus(),0);
        }
        else if(state.step === 1){
          titleEl.textContent = "PDF Step 2/4 — Back page text";
          helpEl.textContent = "Each word becomes a line on the back page.";
          const ta = document.createElement("textarea");
          ta.value = state.backText;
          ta.placeholder = "e.g. THANK YOU / 2025";
          ta.oninput = () => state.backText = ta.value;
          fieldWrap.appendChild(ta);
          nextBtn.textContent = "Next";
          setTimeout(()=>ta.focus(),0);
        }
        else if(state.step === 2){
          titleEl.textContent = "PDF Step 3/4 — Title text colour";
          helpEl.textContent = "Choose black or white for the front page title.";
          const sel = document.createElement("select");
          ["black","white"].forEach(v=>{
            const o=document.createElement("option");
            o.value=v; o.textContent=v;
            sel.appendChild(o);
          });
          sel.value = state.titleColour;
          sel.onchange = () => state.titleColour = sel.value;
          fieldWrap.appendChild(sel);
          nextBtn.textContent = "Next";
          setTimeout(()=>sel.focus(),0);
        }
        else{
          titleEl.textContent = "PDF Step 4/4 — Back text colour";
          helpEl.textContent = "Choose black or white for the back page text.";
          const sel = document.createElement("select");
          ["black","white"].forEach(v=>{
            const o=document.createElement("option");
            o.value=v; o.textContent=v;
            sel.appendChild(o);
          });
          sel.value = state.backColour;
          sel.onchange = () => state.backColour = sel.value;
          fieldWrap.appendChild(sel);
          nextBtn.textContent = "Generate PDF";
          setTimeout(()=>sel.focus(),0);
        }
      }

      cancelBtn.onclick = () => cleanup(null);

      backBtn.onclick = () => {
        if(state.step > 0){
          state.step--;
          renderStep();
        }
      };

      nextBtn.onclick = () => {
        if(state.step < 3){
          state.step++;
          renderStep();
        }else{
          cleanup({
            title: (state.title || "").trim(),
            backText: (state.backText || "").trim(),
            titleColour: state.titleColour,
            backColour: state.backColour
          });
        }
      };

      renderStep();
    });
  }

  async function downloadZinePDF(){
    if(zinePages.length===0){
      alert("No pages in the zine yet. Add at least one page first.");
      return;
    }
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert("PDF library (jsPDF) failed to load.");
      return;
    }

    const wizardResult = await openPdfWizard(zineTitle || "");
    if(!wizardResult) return;

    zineTitle = wizardResult.title;
    const backText = wizardResult.backText;

    const titleTextColor = (wizardResult.titleColour === "white") ? [255,255,255] : [0,0,0];
    const backTextColor  = (wizardResult.backColour  === "white") ? [255,255,255] : [0,0,0];

    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF({orientation:"portrait",unit:"pt",format:"a4"});
    const pageWidth=pdf.internal.pageSize.getWidth();
    const pageHeight=pdf.internal.pageSize.getHeight();

    zinePages.forEach((page,idx)=>{
      const dataUrl=page.dataUrl;
      if(idx>0) pdf.addPage();
      const imgProps=pdf.getImageProperties(dataUrl);
      const imgRatio=imgProps.width/imgProps.height;
      const pageRatio=pageWidth/pageHeight;
      let w,h;
      if(imgRatio>pageRatio){
        w=pageWidth*0.9;
        h=w/imgRatio;
      }else{
        h=pageHeight*0.9;
        w=h*imgRatio;
      }
      const x=(pageWidth-w)/2;
      const y=(pageHeight-h)/2;
      pdf.addImage(dataUrl,"JPEG",x,y,w,h);

      if(idx===0 && zineTitle){
        addOverlayText(pdf,zineTitle,x,y,w,h,titleTextColor);
      }
      if(idx===zinePages.length-1 && backText){
        addOverlayText(pdf,backText,x,y,w,h,backTextColor);
      }
    });

    let baseName;
    if(zineTitle && zineTitle.length>0){
      baseName = zineTitle
        .replace(/[^\w\-]+/g,"_")
        .replace(/^_+|_+$/g,"") || "SPPE_ZINE";
    }else{
      const d=new Date();
      const p=n=>String(n).padStart(2,"0");
      baseName = `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}_SPPE_ZINE`;
    }

    pdf.save(baseName + ".pdf");
  }

  function handleZineClick(mouseX,mouseY){
    if(!(mouseX>=ZINE_PANEL_X && mouseX<=ZINE_PANEL_X+ZINE_PANEL_WIDTH &&
         mouseY>=ZINE_PANEL_Y && mouseY<=ZINE_PANEL_Y+ZINE_PANEL_HEIGHT)){
      return false;
    }

    if(mouseX>=zineAddButton.x && mouseX<=zineAddButton.x+zineAddButton.w &&
       mouseY>=zineAddButton.y && mouseY<=zineAddButton.y+zineAddButton.h){
      addPageToZine();
      return true;
    }

    if(mouseX>=zinePdfButton.x && mouseX<=zinePdfButton.x+zinePdfButton.w &&
       mouseY>=zinePdfButton.y && mouseY<=zinePdfButton.y+zinePdfButton.h){
      downloadZinePDF();
      return true;
    }

    const countY = ZINE_PANEL_Y + 4 + (ZINE_BUTTON_HEIGHT + 3) * 2 + 1;
    const thumbsTop = countY + 10;

    if(mouseY>=thumbsTop){
      const relY = mouseY - thumbsTop;
      const perThumb = ZINE_THUMB_H + ZINE_THUMB_MARGIN;
      const idx = Math.floor(relY / perThumb);
      if(idx>=0 && idx<zinePages.length && idx<ZINE_MAX_PAGES){
        saveState();
        if(selectedZineIndex === -1){
          selectedZineIndex = idx;
          setZinePreview(idx);
        }else if(selectedZineIndex === idx){
          selectedZineIndex = -1;
          setZinePreview(-1);
        }else{
          const tmp = zinePages[selectedZineIndex];
          zinePages[selectedZineIndex] = zinePages[idx];
          zinePages[idx] = tmp;
          selectedZineIndex = -1;
          setZinePreview(-1);
        }
        return true;
      }
    }
    return false;
  }

  function handlePatternMouseDown(mouseX,mouseY){

    patStartScrollY = patternScrollY;
    patMoved = false;

  function handlePatternMouseMove(mouseX,mouseY){
    if(!patTracking) return false;
    const dy = mouseY - patStartY;
    if(Math.abs(dy) > 2) patMoved = true;
    patternScrollY = patStartScrollY + dy;
    clampPatternScroll();
    return true;
  }

  function handlePatternMouseUp(mouseX,mouseY){
    if(!patTracking) return false;
    if(!patMoved){
      const idx = patIndexFromPoint(mouseX,mouseY);
      if(idx !== -1){
        saveState();
        switchToPattern(idx+1);
      }
    }
    patTracking = false;
    return true;
  }

    const mouseX=(touch.clientX-rect.left)/currentScale;
    const mouseY=(touch.clientY-rect.top)/currentScale;

    // Pattern panel tap-to-select if it wasn’t a scroll
    if(patTracking){
      if(!patMoved){
        const idx = patIndexFromPoint(mouseX,mouseY);
        if(idx !== -1){
          saveState();
          switchToPattern(idx+1);
        }
      }
      patTracking = false;
      return;
    }

    if(isDrawing){
      isDrawing = false;
      return;
    }

    if(dragging && draggedItem){
      if(mouseX>=deleteButton.x&&mouseX<=deleteButton.x+deleteButton.w&&mouseY>=deleteButton.y&&mouseY<=deleteButton.y+deleteButton.h){
        saveState();
        const index=circleInstances.indexOf(draggedItem);
        if(index>-1)circleInstances.splice(index,1);
      }
    }
    dragging=false;
    draggedItem=null;
    lastTouchX=null;
    lastTouchY=null;
  },{passive:false});

  window.addEventListener("keydown",function(e){
    switch(e.key){
      case "ArrowUp":
        saveState();
        backgroundY-=200;break;
      case "ArrowDown":
        saveState();
        backgroundY+=200;break;
      case "ArrowLeft":
        saveState();
        backgroundX-=10;break;
      case "ArrowRight":
        saveState();
        backgroundX+=10;break;
      case "f":case "F":
        if(draggedItem){
          saveState();
          const index=circleInstances.indexOf(draggedItem);
          if(index>-1){
            circleInstances.splice(index,1);
            circleInstances.push(draggedItem);
          }
        }
        break;
      case "b":case "B":
        if(draggedItem){
          saveState();
          const index=circleInstances.indexOf(draggedItem);
          if(index>-1){
            circleInstances.splice(index,1);
            circleInstances.unshift(draggedItem);
          }
        }
        break;
      case "n":case "N":
        if(draggedItem){
          const index=circleInstances.indexOf(draggedItem);
          if(index>-1 && index<circleInstances.length-1){
            saveState();
            [circleInstances[index],circleInstances[index+1]]=[circleInstances[index+1],circleInstances[index]];
          }
        }
        break;
      case "m":case "M":
        if(draggedItem){
          const index=circleInstances.indexOf(draggedItem);
          if(index>0){
            saveState();
            [circleInstances[index],circleInstances[index-1]]=[circleInstances[index-1],circleInstances[index]];
          }
        }
        break;
      case "Backspace":case "Delete":
        if(draggedItem){
          saveState();
          const index=circleInstances.indexOf(draggedItem);
          if(index>-1){
            circleInstances.splice(index,1);
            draggedItem=null;
          }
        }
        break;
      case "l":case "L":
        saveState();
        toggleDragEnabled=!toggleDragEnabled;
        toggleDragButton.label=toggleDragEnabled?"BG Move On":"BG Move Off";
        break;
      case "s":case "S":
        saveState();
        currentSwatchIndex=(currentSwatchIndex+1)%colorSwatches.length;
        selectedColor="rgb("+colorSwatches[currentSwatchIndex].join(",")+")";
        break;
      case "d":case "D":
        saveState();
        toggleBorderOn=!toggleBorderOn;
        break;
      case "p":case "P":
        saveState();
        drawMode = !drawMode;
        break;
      case "q":case "Q":
        window.close();
        break;
      case "z":case "Z":
        if(e.ctrlKey || e.metaKey){
          e.preventDefault();
          undoLastAction();
        }
        break;
    }
  });

  function scaleCanvas(){
    const vw=window.visualViewport?Math.floor(window.visualViewport.width):window.innerWidth;
    const vh=window.visualViewport?Math.floor(window.visualViewport.height):window.innerHeight;
    const scale=Math.min(vw/DESIGN_WIDTH,vh/DESIGN_HEIGHT);
    currentScale=scale;
    canvas.style.width=(DESIGN_WIDTH*scale)+"px";
    canvas.style.height=(DESIGN_HEIGHT*scale)+"px";
  }
  window.addEventListener("resize",scaleCanvas);
  if(window.visualViewport){
    visualViewport.addEventListener("resize",scaleCanvas);
    visualViewport.addEventListener("scroll",scaleCanvas);
  }
  scaleCanvas();
</script>
</body>
</html>
